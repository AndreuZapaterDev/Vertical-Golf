services:
  # Desarrollo: http://localhost:5173  (docker compose up)
  game:
    build:
      context: .
      target: dev
    ports:
      - "${GAME_PORT:-5173}:5173"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules   # conserva los node_modules del contenedor
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Producción: http://localhost:8080  (docker compose --profile prod up --build game-prod)
  game-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
